[package]
name = "rkyv_util"
description = "Tools for zero-copy deserialization with rkyv"
version = "0.1.0-alpha.1"
authors = ["David Koloski <djkoloski@gmail.com>"]
edition = "2021"
license = "MIT"

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["bytecheck"] }
memmap2-0_9 = { package = "memmap2", version = "0.9", optional = true }

[features]
default = ["std"]
alloc = ["rkyv/alloc"]
std = ["alloc", "rkyv/std"]
